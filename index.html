<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#091b27">
<title>人形訓練場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed canvas arena; HUD floats on top; menus are centered sheets over a drifting arena. */
:root{
  --bg:#091b27; --panel:#142936; --panel-2:#17323f; --line:#41616a;
  --ink:#eaf5f7; --muted:#a8bec7; --aqua:#53dfcb; --gold:#f9cf70; --danger:#ff8f83;
  --font:'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans GB',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
  overflow:hidden; overscroll-behavior:none; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;background:var(--bg)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;display:flex;align-items:flex-start;gap:12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud[hidden]{display:none}
/* 效果列：畫面下方中央的小方格（圖示＋剩餘秒數，灰色遮罩表示已經過的時間） */
#effects{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;pointer-events:none;z-index:6}
.eff{position:relative;width:34px;height:34px;border-radius:7px;border:2px solid var(--c);background:#071a26d9;overflow:hidden;display:grid;place-items:center;box-shadow:0 0 8px color-mix(in srgb,var(--c) 45%,transparent)}
.eff b{font-size:15px;font-weight:900;color:var(--c);line-height:1;position:relative}
.eff i{position:absolute;left:0;right:0;top:0;background:#000a;height:0}
.eff span{position:absolute;right:2px;bottom:0;font-size:10px;font-weight:800;color:#eaf5f7;text-shadow:0 1px 2px #000}
/* 手機：放在搖桿上方，避免跟按鈕重疊 */
body.touch #effects{left:calc(max(20px,env(safe-area-inset-left,0px)) + 4px);transform:none;bottom:calc(158px + env(safe-area-inset-bottom,0px))}
body.touch .eff span{font-size:9px}
body.touch .eff{width:28px;height:28px}
body.touch .eff b{font-size:13px}
.hud-block{background:#071a26c7;border:1px solid #31515d;border-radius:12px;padding:6px 12px;backdrop-filter:blur(4px)}
.hud-label{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.hud-num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#hudScore{display:flex;gap:16px}
#hudHp{flex:1;min-width:90px;max-width:320px;margin:0 auto}
#hpTrack{height:9px;border-radius:99px;background:#263d45;border:1px solid #45636a;overflow:hidden;margin-top:5px}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,var(--aqua),var(--gold));transition:width .15s}
#hpTrack{position:relative}
.shield-fill{position:absolute;left:0;top:0;height:100%;width:0;background:rgba(110,170,255,.62);transition:width .15s;pointer-events:none}
#shieldFill2{background:rgba(150,205,255,.85)}
#shieldNum{color:#9cc6ff;margin-left:6px}
.skill-stack{position:absolute;left:-3px;top:-3px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:#ff7a3d;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 6px #ff7a3daa;pointer-events:none}
#hpText{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
#hudRight{display:flex;gap:8px;align-items:stretch;pointer-events:auto}
#ammoBlock{min-width:76px}
#reloadBar{height:3px;margin-top:5px;border-radius:2px;background:var(--aqua);width:0}
.icon-btn{width:44px;border:1px solid #31515d;border-radius:12px;background:#071a26c7;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.icon-btn:hover{border-color:var(--aqua)}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding-top:max(16px,env(safe-area-inset-top,0px)); padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:#071a26c2;backdrop-filter:blur(4px)}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:560px;margin:auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,34px);box-shadow:0 20px 60px #06141db0}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--aqua)}
h1{margin:0;font-size:clamp(28px,6vw,40px);font-weight:800;line-height:1.15;text-wrap:balance}
h2{margin:0 0 8px;font-size:26px;font-weight:800}
.lede{margin:8px 0 18px;font-size:15px;line-height:1.6;color:#b8cbd0}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.char{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;padding:12px 10px;border-radius:16px;border:1px solid var(--line);background:#102a35;color:var(--ink);cursor:pointer;font-family:inherit}
.char.is-on{border-color:var(--aqua);box-shadow:0 0 0 2px #53dfcb55}
.char img{width:112px;height:90px;object-fit:contain;image-rendering:auto}
.char b{font-size:16px;color:var(--aqua)}
.char small{font-size:12px;line-height:1.45;color:var(--gold);font-weight:700;text-wrap:balance}
.char.locked{opacity:.65;cursor:not-allowed;border-style:dashed}
.char.locked b{color:var(--muted)}
.lock-q{width:112px;height:90px;display:grid;place-items:center;font-size:44px;font-weight:800;color:#6f8b93}
.btn{border:0;border-radius:12px;padding:13px 28px;font-size:16px;font-weight:800;cursor:pointer;background:#1b3540;color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--aqua);color:#082b35;border-color:var(--aqua)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.help{margin:14px 0 0;font-size:13px;line-height:1.6;color:var(--muted)}
/* 載入素材時的人形小資訊 */
.load-tip{margin:14px auto 0;max-width:30em;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:#0b2230;border:1px solid #1f4250;text-align:left;animation:tipIn .35s ease}
.load-tip img{height:44px;width:auto;flex:none}
.load-tip p{margin:0;font-size:13px;line-height:1.55;color:var(--ink)}
.load-tip small{display:block;font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:800}
#menu.loading .help{display:none}
@keyframes tipIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.best{margin:6px 0 0;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.big-score{font-size:44px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.stats-line{margin:0 0 18px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.field{display:flex;align-items:center;gap:12px;margin:14px 0 18px;font-size:14px;color:var(--muted)}
.field input{flex:1;accent-color:var(--aqua);height:24px}
body.touch .only-mouse{display:none}
body:not(.touch) .only-touch{display:none}

/* Touch controls */
#touchui{position:fixed;inset:0;z-index:6;pointer-events:none}
body:not(.touch) #touchui{display:none}
#touchui[hidden]{display:none}
#stickRing{left:calc(max(20px,env(safe-area-inset-left,0px)) + 64px);top:calc(100% - 86px - env(safe-area-inset-bottom,0px))}
#stickRing{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #8cecd289;background:#103640a8;box-shadow:inset 0 0 0 12px #53dfcb0c;opacity:.35;transition:opacity .12s}
#stickRing.on{opacity:1}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:2px solid #c4fff1;background:linear-gradient(145deg,#3eb9a9,#176a70)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:1px solid #8cecd2aa;background:#103640e0;color:#e7fff6;font-weight:800;font-size:16px;display:grid;place-items:center;box-shadow:0 5px 18px #03172088}
.tbtn.held{filter:brightness(1.35);transform:scale(.96)}
#tFire{width:88px;height:88px;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));background:#258d83}
#dodgeBlock{min-width:60px}
#dodgePips{display:flex;gap:5px;margin-top:6px}
.dpip{width:12px;height:12px;border-radius:50%;border:1.5px solid #53dfcb;background:transparent}
.dpip.on{background:var(--aqua);box-shadow:0 0 6px #53dfcb99}
#dodgeBar{height:3px;margin-top:5px;border-radius:2px;background:var(--gold);width:0}
#tDodge{width:62px;height:62px;right:max(32px,env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px));background:#2b5b6b}
#tReload{width:62px;height:62px;right:calc(max(20px,env(safe-area-inset-right,0px)) + 100px);bottom:calc(22px + env(safe-area-inset-bottom,0px))}
@media (max-height:430px){#tDodge{width:56px;height:56px;bottom:calc(106px + env(safe-area-inset-bottom,0px))}#tFire{width:76px;height:76px}#tReload{width:56px;height:56px;right:calc(max(20px,env(safe-area-inset-right,0px)) + 88px)}.hud-num{font-size:18px}}
#hpText{white-space:nowrap;gap:8px}
@media (max-width:520px){#ammoBlock .hud-label,#hpText span:first-child{display:none}#ammoBlock{min-width:0}#hudHp{min-width:70px}}
@media (max-width:520px){#hud{gap:8px}.hud-block{padding:5px 9px}#hudScore{gap:10px}.hud-num{font-size:18px}.icon-btn{width:38px}}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
/* 首頁按鈕列、關卡、圖鑑 */
.menu-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.menu-row .btn{padding:10px 18px;font-size:15px}
.menu-row .btn b{color:var(--aqua)}
.overlay.sub{z-index:25}
.level-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0 18px}
.level{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:16px 12px;border-radius:16px;border:1px solid var(--line);background:#102a35;color:var(--ink);cursor:pointer;font-family:inherit;text-align:center}
.level.is-on{border-color:var(--aqua);box-shadow:0 0 0 2px #53dfcb55}
.level svg{width:64px;height:64px}
.level b{font-size:17px;color:var(--aqua)}
.level small{font-size:12.5px;line-height:1.5;color:#b8cbd0}
.level.locked{opacity:.6;cursor:not-allowed;border-style:dashed}
.level.locked b{color:var(--muted)}
.codex{max-width:720px;text-align:left}
.codex h2{text-align:center}
.codex-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.codex-tab{display:flex;flex-direction:column;align-items:center;gap:2px;width:104px;padding:6px;border-radius:12px;border:1px solid var(--line);background:#102a35;cursor:pointer;font-family:inherit;color:var(--ink)}
.codex-tab img{height:58px;width:auto;max-width:100%;object-fit:contain}
.codex-tab span{font-size:12px;font-weight:700}
.codex-tab.is-on{border-color:var(--aqua);box-shadow:0 0 0 2px #53dfcb55}
.codex-body{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}
@media (max-width:560px){.codex-body{grid-template-columns:1fr}.codex-portrait{max-width:160px;margin:auto}}
.codex-portrait{background:radial-gradient(circle at 50% 60%,#1f4652,#0f2731);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;place-items:center}
.codex-portrait img{width:100%;height:auto;image-rendering:auto}
.codex-name{margin:0 0 2px;font-size:22px;font-weight:800}
.codex-sub{margin:0 0 12px;color:var(--gold);font-size:13px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin:0 0 14px}
.stat-grid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #2a4651;padding:4px 0;font-size:13.5px;min-width:0}
.stat-grid dt{color:var(--muted)}
.stat-grid dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.codex-h{margin:4px 0 8px;font-size:13px;letter-spacing:.12em;color:var(--aqua);font-weight:800}
.ecodex-group{margin:4px 0 2px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.ecodex-group.elite{color:var(--gold)}
#ecodexTabs .codex-tabs{margin:6px 0 12px}
.codex-tab.elite{border-color:#8a6a2e;background:#2a2412}
.codex-tab.elite.is-on{border-color:var(--gold);box-shadow:0 0 0 2px #f9cf7055}
.codex-portrait img.shadow{filter:brightness(0);opacity:.88}
.codex-tab img.shadow{filter:brightness(0);opacity:.88}
.rank{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:800;vertical-align:3px;background:#2a4651;color:var(--ink)}
.rank.elite{background:var(--gold);color:#2a1d00}
.codex-text{margin:0 0 12px;font-size:13.5px;line-height:1.65;color:var(--ink)}
.codex-where{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.skill-card{display:flex;gap:12px;align-items:flex-start;background:#102a35;border:1px solid var(--line);border-radius:14px;padding:12px}
.skill-card img{width:52px;height:52px;border-radius:50%;flex:none}
.skill-card b{font-size:16px}
.skill-card p{margin:4px 0 0;font-size:13.5px;line-height:1.6;color:#c7d8dc}
.skill-card .cd{color:var(--gold);font-size:12.5px;font-weight:700;margin-left:6px}
.skill-none{color:var(--muted);font-size:14px;padding:10px 0}
/* 技能按鈕（HUD／手機） */
#skillBtn{position:relative;width:40px;height:40px;padding:0;border-radius:50%;border:2px solid #31515d;background:#071a26c7;cursor:pointer;align-self:center}
body.touch #skillBtn{display:none}
#skillBtn img,#tSkill img{width:100%;height:100%;border-radius:50%;display:block}
.skill-cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.skill-cd-num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;font-variant-numeric:tabular-nums}
.skill-key{position:absolute;right:-2px;bottom:-2px;font-size:10px;font-weight:800;background:#071a26;border:1px solid var(--line);border-radius:5px;padding:0 4px;color:var(--muted)}
#skillBtn.armed,#tSkill.armed{border-color:#c48bff;box-shadow:0 0 0 2px #c48bff88,0 0 14px #b06bffcc}
#skillBtn.sixkill.armed,#tSkill.sixkill.armed{border-color:#ff5d8f;box-shadow:0 0 0 2px #ff5d8f88,0 0 14px #ff3d7fcc}
#skillBtn.resonance.armed,#tSkill.resonance.armed{border-color:#ffe36b;box-shadow:0 0 0 2px #ffe36b88,0 0 14px #ffd23bcc}
#skillBtn.glory.armed,#tSkill.glory.armed{border-color:#ffb347;box-shadow:0 0 0 2px #ffb34788,0 0 14px #ff9a1fcc}
#tSkill{overflow:visible;width:46px;height:46px;padding:0;right:calc(max(20px,env(safe-area-inset-right,0px)) + 112px);bottom:calc(104px + env(safe-area-inset-bottom,0px));overflow:hidden}
#phaseBlock{pointer-events:auto}
#expandBtn{position:fixed;z-index:7;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:12px 14px;border-radius:14px;border:2px solid var(--gold);background:#3a2c0ee6;color:#ffe7a8;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 0 16px #f9cf7066;animation:expPulse 1.2s ease-in-out infinite}
#expandBtn small{font-size:11px;font-weight:700;color:#d9c48a}
@keyframes expPulse{50%{box-shadow:0 0 26px #f9cf70aa}}
/* 手機版：圓形按鈕，放在技能按鈕左邊 */
body.touch #expandBtn{top:auto;transform:none;width:54px;height:54px;padding:0;border-radius:50%;justify-content:center;font-size:14px;
  right:calc(max(20px,env(safe-area-inset-right,0px)) + 168px);bottom:calc(100px + env(safe-area-inset-bottom,0px))}
body.touch #expandBtn small{display:none}
@media (max-height:430px){body.touch #expandBtn{width:50px;height:50px;right:calc(max(20px,env(safe-area-inset-right,0px)) + 164px)}}
@media (prefers-reduced-motion:reduce){#expandBtn{animation:none}}
#bossSkip,#phaseSkip{display:block;margin-top:4px;font-size:11px;padding:3px 7px;border-radius:7px;border:1px dashed #ff8f83;background:#3a1f25;color:#ffd0d0;cursor:pointer}
#bossBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(68px + env(safe-area-inset-top,0px));z-index:5;width:min(460px,70vw);pointer-events:none}
#bossHead{display:flex;justify-content:space-between;font-size:13px;color:#ffd0d0;text-shadow:0 1px 3px #000;margin-bottom:3px}
#bossHead b{color:#ff8f83;letter-spacing:.1em}
#bossTrack{height:10px;border-radius:6px;background:#2a1418cc;border:1px solid #7a3a42;overflow:hidden}
#bossHpFill{height:100%;width:100%;background:linear-gradient(90deg,#ff3d5a,#ff8f6b);transition:width .15s}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){#hpFill{transition:none}}
</style>
</head>
<body>


<div id="stage"><canvas id="game" aria-label="人形訓練場遊戲畫面"></canvas></div>

<div id="hud" hidden>
  <div id="effects" aria-label="身上的效果"></div>
  <div class="hud-block" id="hudScore">
    <div><span class="hud-label">分數</span><span class="hud-num" id="score">0</span></div>
    <div><span class="hud-label">擊敗</span><span class="hud-num" id="kills">0</span></div>
  </div>
  <div class="hud-block" id="phaseBlock" hidden><span class="hud-label" id="phaseName">第一階段</span><span class="hud-num" id="phaseTime">3:00</span>
    <button id="bossSkip" type="button" hidden>召喚 Boss（測試）</button><button id="phaseSkip" type="button" hidden>跳到下一階段（測試）</button></div>
  <div class="hud-block" id="partsBlock" hidden><span class="hud-label">零件</span><span class="hud-num" id="partsNum">0</span></div>
  <div class="hud-block" id="hudHp">
    <div id="hpText"><span>生命</span><span><span id="hpNum">150 / 150</span><span id="shieldNum"></span></span></div>
    <div id="hpTrack"><div id="hpFill"></div><div class="shield-fill" id="shieldFill"></div><div class="shield-fill" id="shieldFill2"></div></div>
  </div>
  <div id="hudRight">
    <div class="hud-block" id="dodgeBlock"><span class="hud-label">閃避</span><div id="dodgePips"></div><div id="dodgeBar"></div></div>
    <div class="hud-block" id="ammoBlock"><span class="hud-label" id="ammoLabel">彈藥</span><span class="hud-num" id="ammoNum">3 / 3</span><div id="reloadBar"></div></div>
    <button id="skillBtn" type="button" aria-label="技能" title="技能（Q）"><img id="skillImg" alt=""><span class="skill-cd" id="skillCd"></span><span class="skill-cd-num" id="skillNum"></span><span class="skill-key">Q</span><span class="skill-stack" id="skillStack" hidden></span></button>

/* ═══════════════════════════════════════════════════════════════
   角色通用範本（所有角色共用）
   以齊亞帕三重冕為範本：碰撞半徑與整套動畫邏輯都放在這裡，新角色不用重寫。

   動畫邏輯（實作在下方 pose()／drawCharacter()）：
   1. 奔跑且沒有開火：播放「提槍奔跑」整張原圖，面向跟著移動方向。
   2. 停下、開火、或開火後 aimHold 秒內：切換成分體動畫
      （去槍的身體幀 ＋ 可旋轉的「槍＋雙手」），槍對準準星。
   3. 分體動畫中，移動方向與面向相反：跑步幀倒著播，身體稍微後仰（後退）。
   4. 開火：槍口上揚、往後退，並畫出槍口火光。

   每個角色需要的素材（命名固定，見 frames）：
   待機原圖 1、提槍奔跑原圖 4、去槍身體（待機 1＋奔跑 4）、槍＋雙手 1，
   以及骨架資料 meta（握把旋轉中心、槍口位置、各幀的握把位置與槍角度）。
   ═══════════════════════════════════════════════════════════════ */
const CHARACTER_BASE = {
  radius: 20,                    // 碰撞半徑
  // 子彈射程＝鎖敵距離 × 倍率 ＋ rangeAdd
  // 手機版（有自動瞄準）用 rangeScale；電腦版（滑鼠手動瞄準）用 rangeScaleDesktop
  rangeScale: 1.2,
  rangeScaleDesktop: 1.8,
  rangeAdd: 0,
  // 閃避：向前撲一段距離，撲出去的期間＋停下後 afterInvuln 秒無敵
  // 冷卻與可累積次數由各角色的「閃避值」換算（見 dodgeCooldown／dodgeCharges）
  dodgeMove: { distance: 120, time: 0.22, afterInvuln: 0.5 },
  // 奔跑特效（腳下塵土、速度線、身體前傾與起伏）：「當下實際移動速度」超過 runFxSpeed 才出現
  // 手機搖桿推得淺、速度低時不會出現；角色可用 runFx: false 完全關閉
  runFxSpeed: 250,
  anim: {
    scale: 0.0738,               // 1440px 原圖縮放到遊戲內的比例
    runCycle: 0.44,              // 跑完一輪奔跑動畫的秒數（不論幾幀）
    backCycle: 0.57,             // 後退一輪的秒數
    aimHold: 0.45,               // 開火後維持瞄準姿勢的秒數
    aimUp: 55, aimDown: 45,      // 槍的視覺旋轉上下限（度）
    recoil: 0.32, kick: 22,      // 開火後座：上揚弧度、後退距離（原圖像素）
    bob: 0.35,                   // 分體奔跑時槍跟著身體晃動的比例
    backLean: 0.06,              // 後退時身體後仰（弧度）
    breath: 1.6,                 // 待機呼吸起伏（像素）
  },
  // 素材命名（角色可用 frames 覆寫，例如影片擷取的角色奔跑幀數較多）
  frames: {
    preview: 'idle',
    carry: ['run1', 'run2', 'run3', 'run4'],
    body: { idle: 'body_idle', run: ['body_run1', 'body_run2', 'body_run3', 'body_run4'] },
    rigKeys: { body_idle: 'idle', body_run1: 'run1', body_run2: 'run2', body_run3: 'run3', body_run4: 'run4' },
    gun: 'gun',
  },
};
// 合併範本與角色專屬資料；角色可用 anim 覆寫範本的個別動畫參數
function defineCharacter(def) {
  return {
    ...CHARACTER_BASE, ...def,
    anim: { ...CHARACTER_BASE.anim, ...(def.anim || {}) },
    frames: { ...CHARACTER_BASE.frames, ...(def.frames || {}) },
    weapon: { reloadMode: 'shell', sound: 'shotgun', ...def.weapon },
    runFx: def.runFx !== false,
  };
}

function hash(x, y, n = 0) {

function drawGround(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 地面底色：遠處（上）偏亮偏霧，近處（下）偏深
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#24505a'); g.addColorStop(VIEW3D.anchor * 0.7, '#183a43'); g.addColorStop(1, '#0d2530');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const vb = viewBounds(), gr = 110;
  const x0 = cam.x - vb.hw - gr, x1 = cam.x + vb.hw + gr, y0 = cam.y + vb.t - gr, y1 = cam.y + vb.b + gr;
  ctx.strokeStyle = 'rgba(109,163,155,0.16)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = Math.floor(x0 / gr) * gr; x < x1; x += gr) { const a = proj(x, y0), b = proj(x, y1); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
  for (let y = Math.floor(y0 / gr) * gr; y < y1; y += gr) { const a = proj(x0, y), b = proj(x1, y); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
  ctx.stroke();
  for (const c of chunks.values()) for (const d of c.details) {
    const q = proj(d.x, d.y);
    if (!onScreen(q, d.r * q.k + 20)) continue;
    ground(q, d.x, d.y);
    ctx.fillStyle = d.kind > 0.5 ? 'rgba(180,230,217,0.045)' : 'rgba(119,185,163,0.05)';
    ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 0.44, 0, 0, Math.PI * 2); ctx.fill();
    if (d.kind > 0.78) {
      ctx.strokeStyle = 'rgba(133,185,165,0.23)'; ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(d.x - 7, d.y + 3); ctx.lineTo(d.x + 3, d.y - 5); ctx.lineTo(d.x + 11, d.y + 2); ctx.stroke();
    }
  }
}
function drawCrate(b) {
  const q = proj(b.x, b.y), x = b.x, y = b.y;
  ground(q, x, y);
  ctx.fillStyle = 'rgba(8,27,35,0.6)'; ctx.beginPath(); ctx.ellipse(x + 6, y + 22, 25, 11, 0, 0, Math.PI * 2); ctx.fill();
  upright(q, x, y);
  // 箱子有頂面：越往畫面上方（越遠）看到的頂面越少
  const top = 4 + 6 * VIEW3D.squash * clamp(q.k / zoom, 0.6, 1.4);
  ctx.fillStyle = '#ffe3a1'; ctx.fillRect(x - 17, y - 17 - top, 34, top + 1);
  ctx.fillStyle = '#a46f38'; ctx.fillRect(x - 17, y - 17, 34, 34);
  ctx.fillStyle = b.hp === 3 ? '#f5c66f' : b.hp === 2 ? '#e6ae5c' : '#c88749'; ctx.fillRect(x - 14, y - 14, 28, 28);
  ctx.fillStyle = '#ffdf93'; ctx.fillRect(x - 14, y - 14, 28, 4);
}
function draw(t) {
  if (state === 'menu' || state === 'over' && !player) { cam.x += 0.25; cam.y += 0.1; stream(); }
  shx = shake ? rand(-shake, shake) : 0; shy = shake ? rand(-shake, shake) : 0;
  drawGround(t);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);   // proj() 回傳螢幕座標
  // 奔跑塵土：畫在地面上、角色之下
  for (const f of runFx) {
    if (f.kind !== 'dust') continue;
    const q = proj(f.x, f.y), a = f.life / f.max;
    ctx.fillStyle = 'rgba(196,186,160,' + (0.34 * a) + ')';
    ctx.beginPath(); ctx.ellipse(q.x, q.y, f.r * q.k, f.r * q.k * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 速度線：身後的短白線
  ctx.lineCap = 'round';
  for (const f of runFx) {
    if (f.kind !== 'line') continue;
    const a = f.life / f.max, q1 = proj(f.x, f.y), q2 = proj(f.x - Math.cos(f.dir) * f.len, f.y - Math.sin(f.dir) * f.len);
    ctx.strokeStyle = 'rgba(235,250,255,' + (0.55 * a) + ')'; ctx.lineWidth = 1.6 * q1.k;
    ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  for (const pt of parts) drawPart(pt);
  if (boss && !boss.B.ai) drawBossTargets(boss);
  const actors = [...covers().map((it) => ({ it, k: 'c' })), ...enemies.map((it) => ({ it, k: 'e' })), ...(player && state !== 'menu' ? [{ it: player, k: 'p' }, ...clones.map((it) => ({ it, k: 'm' }))] : [])].sort((a, b) => a.it.y - b.it.y);
  for (const { it, k } of actors) {
    const q = proj(it.x, it.y);
    if (!onScreen(q, 120 * q.k)) continue;
    if (k === 'c') drawCrate(it);
    else if (k === 'e' && it.boss) ({ dreamer: drawDreamer, scarecrow: drawScarecrow }[it.B.ai] || drawBoss)(it);
    else if (k === 'm') {
      // 擴編分身
      ctx.save(); drawCharacter(it, false); ctx.restore();
      if (it.hp < it.maxHp) {
        upright(q, it.x, it.y);
        ctx.fillStyle = '#d23b3b'; ctx.fillRect(it.x - 16, it.y - 44, 32, 4);
        ctx.fillStyle = '#4fd36a'; ctx.fillRect(it.x - 16, it.y - 44, 32 * Math.max(0, it.hp) / it.maxHp, 4);
      }
    }
    else if (k === 'e') {
      if (it.debuffT > 0) {
        const qq = proj(it.x, it.y); ground(qq, it.x, it.y);
        ctx.strokeStyle = 'rgba(255,93,143,' + (0.4 + 0.4 * Math.min(1, it.debuffT)) + ')'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.arc(it.x, it.y, it.r + 6, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      if (it.T.ai === 'drone') drawDrone(it); else if (it.T.sprite) drawSpriteEnemy(it); else drawCharacter(it, true);
      upright(q, it.x, it.y);
      if (it.debuffT > 0) {
        ctx.fillStyle = '#ff5d8f'; ctx.font = '800 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('易傷', it.x, it.y - 50);
      }
      const hy = it.T.ai === 'drone' ? it.y - 54 : it.y - 42, hw = it.T.ai === 'drone' ? 24 : 36;   // 浮游砲飛得比較高、血條較短
      ctx.fillStyle = '#26343b'; ctx.fillRect(it.x - hw / 2, hy, hw, 4);
      ctx.fillStyle = '#ff988c'; ctx.fillRect(it.x - hw / 2, hy, hw * Math.max(0, it.hp) / it.T.hp, 4);
    } else {
      // 閃避殘影
      for (const g of it.trail || []) drawCharacter({ ...it, x: g.x, y: g.y, dodgeT: 1, moving: true, aiming: false, shot: 0 }, false, 0.28 * g.life / 0.25);
      if (it.shield > 0) {
        // 有護盾：腳下藍色光圈
        const qq = proj(it.x, it.y); ground(qq, it.x, it.y);
        ctx.strokeStyle = 'rgba(140,190,255,0.75)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(it.x, it.y, it.r + 5, 0, Math.PI * 2); ctx.stroke();
      }
      if (it.buffT > 0) {
        // 榮光延續：腳下橘色光環
        const qq = proj(it.x, it.y); ground(qq, it.x, it.y);
        const pulse = 1 + 0.08 * Math.sin(gameTime * 10);
        ctx.strokeStyle = 'rgba(255,179,71,' + (0.5 + 0.3 * Math.min(1, it.buffT)) + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(it.x, it.y, (it.r + 10) * pulse, 0, Math.PI * 2); ctx.stroke();
      }
      drawCharacter(it, false);
      drawBirds();
    }
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const b of bullets) {
    const q = proj(b.x, b.y), lift = 7 * Math.sin(Math.min(1, b.age / (b.maxLife || b.life + b.age)) * Math.PI);
    ctx.fillStyle = 'rgba(4,24,32,0.4)'; ctx.beginPath(); ctx.ellipse(q.x + 3 * q.k, q.y + 5 * q.k, 6 * q.k, 3 * q.k * VIEW3D.squash, 0, 0, Math.PI * 2); ctx.fill();
    if (b.elec) {
      // 夢想家的雷電球：藍白色發光球，外圈閃爍電弧
      const r = b.r * q.k, y = q.y - lift * q.k;
      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#4aa8ff';
      ctx.beginPath(); ctx.arc(q.x - b.vx * 0.02 * q.k, y - b.vy * 0.02 * q.k, r * 1.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#dff4ff'; ctx.shadowColor = '#4aa8ff'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(q.x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = '#8fd0ff'; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2 + gameTime * 9, rr = r * (1.25 + Math.random() * 0.5); ctx[k ? 'lineTo' : 'moveTo'](q.x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
      ctx.closePath(); ctx.stroke();
      continue;
    }
    if (b.lacer) {
      // 裂傷紀錄的彈丸：紅色，飛超過 200 變紫色並發光
      const col = b.purple ? '#b06bff' : '#ff6b6b', r = b.r * q.k * (b.purple ? 1.6 : 1.3);
      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(q.x - b.vx * 0.012 * q.k, q.y - lift * q.k - b.vy * 0.012 * q.k, r * 1.4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = b.purple ? 12 : 6;
      ctx.beginPath(); ctx.arc(q.x, q.y - lift * q.k, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      continue;
    }
    ctx.fillStyle = b.team === 'p' ? (b.buff > 1 ? '#ffb347' : '#d5fff1') : (b.boss ? '#ff5d5d' : '#ffb2a6');
    ctx.beginPath(); ctx.arc(q.x, q.y - lift * q.k, b.r * q.k * (b.buff > 1 ? 1.3 : 1), 0, Math.PI * 2); ctx.fill();
  }
  for (const p of particles) {
    const q = proj(p.x, p.y), sz = 4 * q.k;
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(q.x - sz / 2, q.y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
  drawMissiles();
  for (const g of grenades) {
    const k = g.t / g.T, x = g.sx + (g.tx - g.sx) * k, y = g.sy + (g.ty - g.sy) * k, h = Math.sin(k * Math.PI) * 60;
    const q = proj(x, y);
    ctx.fillStyle = 'rgba(4,24,32,0.4)'; ctx.beginPath(); ctx.ellipse(q.x, q.y, 6 * q.k, 3 * q.k, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d4a3a'; ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(q.x, q.y - h * q.k, 5 * q.k, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // 落點預告圈
    const gq = proj(g.tx, g.ty); ground(gq, g.tx, g.ty);
    ctx.strokeStyle = 'rgba(255,154,90,0.55)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(g.tx, g.ty, g.lv.radius, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  // 蜂鳥共鳴：擴散的光環（效果範圍）
  for (const r of rings) {
    const k = 1 - r.life / r.max, q = proj(r.x, r.y); ground(q, r.x, r.y);
    ctx.globalAlpha = (1 - k) * 0.7; ctx.strokeStyle = r.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.25 + 0.75 * Math.sqrt(k)), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  for (const b of blasts) {
    const k = 1 - b.life / b.max, q = proj(b.x, b.y); ground(q, b.x, b.y);
    ctx.globalAlpha = (1 - k) * 0.8;
    ctx.fillStyle = b.level >= 3 ? 'rgba(150,200,255,0.35)' : 'rgba(255,140,60,0.35)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (0.4 + 0.6 * Math.min(1, k * 3)), 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = b.level >= 3 ? '#9cc6ff' : '#ffb347'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (0.6 + 0.4 * k), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  for (const f of floaters) {
    const q = proj(f.x, f.y);
    ctx.globalAlpha = Math.max(0, f.life / f.max); ctx.fillStyle = f.color; ctx.font = '800 ' + Math.round(15 * clamp(q.k, 0.7, 1.6)) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text, q.x, q.y);
  }
  ctx.globalAlpha = 1;
  if (state === 'play' && player) {
    // 鎖定範圍：在地面上的圓，投影後變成近大遠小的橢圓
    ctx.strokeStyle = 'rgba(249,207,112,0.4)'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.beginPath();
    for (let i = 0; i <= 72; i++) {
      const a = i / 72 * Math.PI * 2, q = proj(player.x + Math.cos(a) * cfg.lockRange, player.y + Math.sin(a) * cfg.lockRange);
      i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
    }
    ctx.stroke(); ctx.setLineDash([]);
    if (lockedTarget) {
      const e = lockedTarget; ground(proj(e.x, e.y), e.x, e.y); ctx.strokeStyle = '#ff5d67'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, 13, 0, Math.PI * 2); ctx.moveTo(e.x - 19, e.y); ctx.lineTo(e.x + 19, e.y); ctx.moveTo(e.x, e.y - 19); ctx.lineTo(e.x, e.y + 19); ctx.stroke();
    }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const hz = ctx.createLinearGradient(0, 0, 0, H);
  hz.addColorStop(0, 'rgba(46,92,102,' + VIEW3D.haze + ')'); hz.addColorStop(VIEW3D.anchor * 0.55, 'rgba(46,92,102,0)');
  hz.addColorStop(0.82, 'rgba(4,14,20,0)'); hz.addColorStop(1, 'rgba(4,14,20,0.32)');
  ctx.fillStyle = hz; ctx.fillRect(0, 0, W, H);
  if (state === 'play' && player) {
    const ax = W / 2, ay = H * VIEW3D.anchor;
    for (const e of enemies) {
      const q = proj(e.x, e.y), m = 22;
      if (q.x >= m && q.x <= W - m && q.y >= m + 56 && q.y <= H - m) continue;
      const vx = q.x - ax, vy = q.y - ay;
      const kx = vx > 0 ? (W - m - ax) / vx : vx < 0 ? (m - ax) / vx : Infinity;
      const ky = vy > 0 ? (H - m - ay) / vy : vy < 0 ? (m + 56 - ay) / vy : Infinity;
      const k = Math.min(kx, ky), px = ax + vx * k, py = ay + vy * k, a = Math.atan2(vy, vx);
      ctx.save(); ctx.translate(px, py); ctx.rotate(a); ctx.globalAlpha = 0.85; ctx.fillStyle = '#ff7d6e';
      ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-7, -7); ctx.lineTo(-7, 7); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    if (hurtT > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) / 2);
      g.addColorStop(0, 'rgba(255,60,60,0)'); g.addColorStop(1, 'rgba(255,60,60,' + (hurtT / 0.35 * 0.45) + ')');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (!isTouch() && mouse.seen) {
      ctx.strokeStyle = '#f9cf70'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 9, 0, Math.PI * 2);
      ctx.moveTo(mouse.x - 15, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y); ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 15, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 15); ctx.lineTo(mouse.x, mouse.y - 5); ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 15); ctx.stroke();
    }
  }
}

function frame(t) {
  // rAF 的時間戳可能早於按下開始時記錄的 last，所以 dt 要夾在 0 以上
  const dt = clamp((t - last) / 1000, 0, 0.05); last = t;
  try {
    if (state === 'play') update(dt);
    draw(t);
  } catch (err) {
    console.error(err);   // 單一幀出錯也不讓整個遊戲停住
  }
  requestAnimationFrame(frame);
}

/* ───────── 啟動 ───────── */
buildRoster(); showBest(); syncMute(); resize();
requestAnimationFrame((t) => { last = t; frame(t); });
{ const b = $('startBtn'); b.disabled = false; b.textContent = '開始遊戲'; }
prefetch();
})();
</script>
