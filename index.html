<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#091b27">
<title>人形訓練場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed canvas arena; HUD floats on top; menus are centered sheets over a drifting arena. */
:root{
  --bg:#091b27; --panel:#142936; --panel-2:#17323f; --line:#41616a;
  --ink:#eaf5f7; --muted:#a8bec7; --aqua:#53dfcb; --gold:#f9cf70; --danger:#ff8f83;
  --font:'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans GB',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
  overflow:hidden; overscroll-behavior:none; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;background:var(--bg)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;display:flex;align-items:flex-start;gap:12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud[hidden]{display:none}
.hud-block{background:#071a26c7;border:1px solid #31515d;border-radius:12px;padding:6px 12px;backdrop-filter:blur(4px)}
.hud-label{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.hud-num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#hudScore{display:flex;gap:16px}
#hudHp{flex:1;min-width:90px;max-width:320px;margin:0 auto}
#hpTrack{height:9px;border-radius:99px;background:#263d45;border:1px solid #45636a;overflow:hidden;margin-top:5px}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,var(--aqua),var(--gold));transition:width .15s}
#hpText{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
#hudRight{display:flex;gap:8px;align-items:stretch;pointer-events:auto}
#ammoBlock{min-width:76px}
#reloadBar{height:3px;margin-top:5px;border-radius:2px;background:var(--aqua);width:0}
.icon-btn{width:44px;border:1px solid #31515d;border-radius:12px;background:#071a26c7;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.icon-btn:hover{border-color:var(--aqua)}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding-top:max(16px,env(safe-area-inset-top,0px)); padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:#071a26c2;backdrop-filter:blur(4px)}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:560px;margin:auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,34px);box-shadow:0 20px 60px #06141db0}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--aqua)}
h1{margin:0;font-size:clamp(28px,6vw,40px);font-weight:800;line-height:1.15;text-wrap:balance}
h2{margin:0 0 8px;font-size:26px;font-weight:800}
.lede{margin:8px 0 18px;font-size:15px;line-height:1.6;color:#b8cbd0}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.char{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;padding:12px 10px;border-radius:16px;border:1px solid var(--line);background:#102a35;color:var(--ink);cursor:pointer;font-family:inherit}
.char.is-on{border-color:var(--aqua);box-shadow:0 0 0 2px #53dfcb55}
.char img{width:112px;height:90px;object-fit:contain;image-rendering:auto}
.char b{font-size:16px;color:var(--aqua)}
.char small{font-size:12px;line-height:1.45;color:var(--gold);font-weight:700;text-wrap:balance}
.char.locked{opacity:.65;cursor:not-allowed;border-style:dashed}
.char.locked b{color:var(--muted)}
.lock-q{width:112px;height:90px;display:grid;place-items:center;font-size:44px;font-weight:800;color:#6f8b93}
.btn{border:0;border-radius:12px;padding:13px 28px;font-size:16px;font-weight:800;cursor:pointer;background:#1b3540;color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--aqua);color:#082b35;border-color:var(--aqua)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.help{margin:14px 0 0;font-size:13px;line-height:1.6;color:var(--muted)}
.best{margin:6px 0 0;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.big-score{font-size:44px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.stats-line{margin:0 0 18px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.field{display:flex;align-items:center;gap:12px;margin:14px 0 18px;font-size:14px;color:var(--muted)}
.field input{flex:1;accent-color:var(--aqua);height:24px}
body.touch .only-mouse{display:none}
body:not(.touch) .only-touch{display:none}

/* Touch controls */
#touchui{position:fixed;inset:0;z-index:6;pointer-events:none}
body:not(.touch) #touchui{display:none}
#touchui[hidden]{display:none}
#stickRing{left:calc(max(20px,env(safe-area-inset-left,0px)) + 64px);top:calc(100% - 86px - env(safe-area-inset-bottom,0px))}
#stickRing{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #8cecd289;background:#103640a8;box-shadow:inset 0 0 0 12px #53dfcb0c;opacity:.35;transition:opacity .12s}
#stickRing.on{opacity:1}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:2px solid #c4fff1;background:linear-gradient(145deg,#3eb9a9,#176a70)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:1px solid #8cecd2aa;background:#103640e0;color:#e7fff6;font-weight:800;font-size:16px;display:grid;place-items:center;box-shadow:0 5px 18px #03172088}
.tbtn.held{filter:brightness(1.35);transform:scale(.96)}
#tFire{width:88px;height:88px;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));background:#258d83}
#dodgeBlock{min-width:60px}
#dodgePips{display:flex;gap:5px;margin-top:6px}
.dpip{width:12px;height:12px;border-radius:50%;border:1.5px solid #53dfcb;background:transparent}
.dpip.on{background:var(--aqua);box-shadow:0 0 6px #53dfcb99}
#dodgeBar{height:3px;margin-top:5px;border-radius:2px;background:var(--gold);width:0}
#tDodge{width:62px;height:62px;right:max(32px,env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px));background:#2b5b6b}
#tReload{width:62px;height:62px;right:calc(max(20px,env(safe-area-inset-right,0px)) + 100px);bottom:calc(22px + env(safe-area-inset-bottom,0px))}
@media (max-height:430px){#tDodge{width:56px;height:56px;bottom:calc(106px + env(safe-area-inset-bottom,0px))}#tFire{width:76px;height:76px}#tReload{width:56px;height:56px;right:calc(max(20px,env(safe-area-inset-right,0px)) + 88px)}.hud-num{font-size:18px}}
#hpText{white-space:nowrap;gap:8px}
@media (max-width:520px){#ammoBlock .hud-label,#hpText span:first-child{display:none}#ammoBlock{min-width:0}#hudHp{min-width:70px}}
@media (max-width:520px){#hud{gap:8px}.hud-block{padding:5px 9px}#hudScore{gap:10px}.hud-num{font-size:18px}.icon-btn{width:38px}}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){#hpFill{transition:none}}
</style>
</head>
<body>


<div id="stage"><canvas id="game" aria-label="人形訓練場遊戲畫面"></canvas></div>

<div id="hud" hidden>
  <div class="hud-block" id="hudScore">
    <div><span class="hud-label">分數</span><span class="hud-num" id="score">0</span></div>
    <div><span class="hud-label">擊敗</span><span class="hud-num" id="kills">0</span></div>
  </div>
  <div class="hud-block" id="hudHp">
    <div id="hpText"><span>生命</span><span id="hpNum">150 / 150</span></div>
    <div id="hpTrack"><div id="hpFill"></div></div>
  </div>
  <div id="hudRight">
    <div class="hud-block" id="dodgeBlock"><span class="hud-label">閃避</span><div id="dodgePips"></div><div id="dodgeBar"></div></div>
    <div class="hud-block" id="ammoBlock"><span class="hud-label" id="ammoLabel">彈藥</span><span class="hud-num" id="ammoNum">3 / 3</span><div id="reloadBar"></div></div>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="音效開關" title="音效">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <button class="icon-btn" id="pauseBtn" type="button" aria-label="暫停" title="暫停 (P)">
      <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
    </button>
  </div>
</div>

<div id="touchui" hidden>
  <div id="stickRing"><div id="stickKnob"></div></div>
  <button class="tbtn" id="tReload" type="button">裝彈</button>
  <button class="tbtn" id="tDodge" type="button">閃避</button>
  <button class="tbtn" id="tFire" type="button">開火</button>
</div>

<div id="menu" class="overlay">
  <div class="sheet">
    <p class="eyebrow">SOLO ARCADE · 2D 平面對戰</p>
    <h1>人形訓練場</h1>
    <p class="lede">在無限延伸的戰場上移動、瞄準，擊碎金色方塊，迎戰黑色剪影敵人。選一名人形出擊，每個角色的武器與數值都不同。</p>
    <div class="roster" id="roster"></div>
    <button id="startBtn" class="btn primary" type="button" disabled>載入中…</button>
    <p class="help only-mouse">WASD／方向鍵移動 · 滑鼠瞄準 · 左鍵或空白鍵開火 · Shift 或右鍵閃避 · R 裝彈 · 滾輪縮放 · P／Esc 暫停</p>
    <p class="help only-touch">左半邊螢幕拖曳移動 · 右下角開火、裝彈、閃避 · 範圍內自動鎖定最近的敵人</p>
    <p class="best" id="bestLine"></p>
  </div>
</div>

<div id="pause" class="overlay" hidden>
  <div class="sheet" style="max-width:380px">
    <h2>已暫停</h2>
    <label class="field" for="zoomRange"><span>視野</span><input id="zoomRange" type="range" min="0.6" max="1.6" step="0.01" value="1"></label>
    <div class="row">
      <button id="resumeBtn" class="btn primary" type="button">繼續</button>
      <button id="quitBtn" class="btn" type="button">回主選單</button>
    </div>
  </div>
</div>

<div id="over" class="overlay" hidden>
  <div class="sheet" style="max-width:400px">
    <h2>本回合結束</h2>
    <p class="stats-line" style="margin-bottom:0">你的最終得分</p>
    <p class="big-score" id="finalScore">0</p>
    <p class="stats-line" id="finalStats"></p>
    <div class="row">
      <button id="retryBtn" class="btn primary" type="button">再玩一次</button>
      <button id="menuBtn" class="btn" type="button">選擇角色</button>
    </div>
  </div>
</div>

/* ───────── 無限地圖 ───────── */
function hash(x, y, n = 0) {
  let v = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(n + 1, 1442695041);
  v = Math.imul(v ^ (v >>> 13), 1274126177);
  return ((v ^ (v >>> 16)) >>> 0) / 4294967296;
}
function makeChunk(cx, cy) {
  const cover = [], details = [];
  for (let i = 0; i < 7; i++) {
    const x = cx * CHUNK + 30 + hash(cx, cy, i * 4) * 360, y = cy * CHUNK + 30 + hash(cx, cy, i * 4 + 1) * 360;
    if (i < 3 && Math.hypot(x, y) > 210) cover.push({ x, y, r: 19, hp: 3 });
    else details.push({ x, y, r: 13 + hash(cx, cy, i * 4 + 2) * 55, kind: hash(cx, cy, i * 4 + 3) });
  }
  return { cover, details };
}
function stream() {
  const vb = viewBounds();
  const l = Math.floor((cam.x - vb.hw) / CHUNK) - 1, r = Math.floor((cam.x + vb.hw) / CHUNK) + 1;
  const t = Math.floor((cam.y + vb.t) / CHUNK) - 1, b = Math.floor((cam.y + vb.b) / CHUNK) + 1;
  for (let cy = t; cy <= b; cy++) for (let cx = l; cx <= r; cx++) {
    const k = cx + ',' + cy;
    if (!chunks.has(k)) { chunks.set(k, makeChunk(cx, cy)); coverCache = null; }
  }
  for (const k of chunks.keys()) {
    const [cx, cy] = k.split(',').map(Number);
    if (cx < l - 1 || cx > r + 1 || cy < t - 1 || cy > b + 1) { chunks.delete(k); coverCache = null; }
  }
}

/* ───────── 版面 ───────── */
const isTouch = () => document.body.classList.contains('touch');
function computeZoom() {
  const target = isTouch() ? 330 : 540;
  zoom = clamp(Math.min(H / target, W / 360), 0.6, 1.5) * userZoom;
  P3 = VIEW3D.depth * (H * VIEW3D.anchor) / (zoom * VIEW3D.squash);
}

/* ───────── 透視投影 ─────────
   世界座標仍是平面的（遊戲邏輯、碰撞都不變），只有畫面投影成「下近上遠」。
   s = P3 / (P3 - dy)：越往上（dy 越負）越小。直線投影後仍是直線，所以地面格線會向遠方收斂。 */
let P3 = 1000, shx = 0, shy = 0;
function proj(wx, wy) {
  const dy = Math.min(wy - cam.y, P3 * 0.9), s = P3 / (P3 - dy);
  return { x: W / 2 + (wx - cam.x) * s * zoom + shx, y: H * VIEW3D.anchor + dy * s * zoom * VIEW3D.squash + shy, k: s * zoom };
}
function unproj(sx, sy) {
  const fy = Math.max((sy - H * VIEW3D.anchor) / (zoom * VIEW3D.squash), -P3 * 0.98);
  const dy = fy * P3 / (P3 + fy), s = P3 / (P3 - dy);
  return { x: cam.x + (sx - W / 2) / (zoom * s), y: cam.y + dy };
}

// 以某個世界點為中心的局部變換：upright＝站立物（角色、箱子），ground＝貼地物（影子、圈）
function upright(q, ox, oy) { ctx.setTransform(DPR * q.k, 0, 0, DPR * q.k, DPR * (q.x - ox * q.k), DPR * (q.y - oy * q.k)); }

function resize() {

function setState(s) {

  hud.hidden = !(s === 'play' || s === 'pause'); touchui.hidden = !(s === 'play');

/* ───────── 遊戲流程 ───────── */
function updateAmmo() {
  $('ammoNum').textContent = player.ammo + ' / ' + cfg.weapon.magazine;
  $('ammoNum').style.color = player.ammo === 0 ? 'var(--danger)' : '';
}
function updateHp() {
  $('hpNum').textContent = Math.ceil(player.hp) + ' / ' + player.maxHp;
  $('hpFill').style.width = (player.hp / player.maxHp * 100) + '%';
}
function addEnemy() {
  const maxN = Math.min(14, 9 + Math.floor(gameTime / 60));
  if (enemies.length >= maxN) return;
  const a = rand(0, Math.PI * 2), ca = Math.cos(a), sa = Math.sin(a);
  let d = 150;
  while (d < 4000 && onScreen(proj(player.x + ca * d, player.y + sa * d), 90)) d += 40;
  d += rand(20, 90);
  enemies.push({ x: player.x + ca * d, y: player.y + sa * d, r: ENEMY.radius, hp: ENEMY.hp, angle: 0, cool: rand(1.2, 2), touchCd: 0, def: cfg, shot: 0, moving: true, phase: rand(0, 6) });
}

  audio();

  score = 0; kills = 0; gameTime = 0; spawnClock = 0; shake = 0; hurtT = 0;
  player = { x: 0, y: 0, r: cfg.radius, hp: cfg.maxHp, maxHp: cfg.maxHp, ammo: cfg.weapon.magazine, angle: 0, moveAngle: 0, cool: 0, reload: 0, shot: 0, def: cfg, moving: false,
    charges: dodgeCharges(cfg.dodge), chargeT: 0, dodgeT: 0, invT: 0, dodgeDir: 0, trail: [] };
  cam = { x: 0, y: 0 }; chunks.clear(); coverCache = null; computeZoom(); stream();
  enemies = []; bullets = []; particles = []; floaters = [];
  for (let i = 0; i < ENEMY.initial; i++) addEnemy();
  updateDodge(); $('score').textContent = '0'; $('kills').textContent = '0'; $('ammoLabel').textContent = cfg.weapon.name + '彈藥'; updateAmmo(); updateHp();
  setState('play'); last = performance.now();

function endGame() {
  const isBest = score > best;
  if (isBest) { best = score; store.set('rxxlc-best', String(best)); }
  $('finalScore').textContent = score.toLocaleString('zh-TW');
  const m = Math.floor(gameTime / 60), s = Math.floor(gameTime % 60);
  $('finalStats').textContent = '擊敗 ' + kills + ' · 存活 ' + m + ':' + String(s).padStart(2, '0') + (isBest ? ' · 新紀錄' : (best ? ' · 最高分 ' + best.toLocaleString('zh-TW') : ''));
  showBest(); setState('over');
}
function pauseGame() { if (state === 'play') { $('zoomRange').value = userZoom; setState('pause'); } }
function resumeGame() { if (state === 'pause') { setState('play'); last = performance.now(); } }

/* ───────── 輸入 ───────── */
window.addEventListener('keydown', (e) => {
  if (state === 'play' && ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) { keys.add(e.code); return; }
  if (e.code === 'KeyR' && state === 'play') reload();
  if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyK') && state === 'play') startDodge();
  if ((e.code === 'KeyP' || e.code === 'Escape')) { state === 'play' ? pauseGame() : resumeGame(); }
  if ((e.code === 'Equal' || e.code === 'NumpadAdd') && state === 'play') setZoom(userZoom * 1.1);
  if ((e.code === 'Minus' || e.code === 'NumpadSubtract') && state === 'play') setZoom(userZoom / 1.1);
  if (state === 'play') setTouchMode(false);
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', releaseInputs);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
document.addEventListener('contextmenu', (e) => e.preventDefault());

function setZoom(v) { userZoom = clamp(v, 0.6, 1.6); computeZoom(); stream(); }

function endStick() {
  stick.id = null; stick.x = stick.y = 0; stickRing.classList.remove('on');
  stickRing.style.left = ''; stickRing.style.top = '';
  stickKnob.style.transform = 'translate(0,0)';
}
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse') {
    setTouchMode(false);
    if (state === 'play' && e.button === 2) { startDodge(); return; }
    if (state !== 'play' || e.button !== 0) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    mouseDown = true; mouse.x = e.offsetX; mouse.y = e.offsetY; mouse.seen = true;
    return;
  }
  // 觸控／手寫筆：左側 55% 拖曳 = 浮動搖桿
  setTouchMode(true);
  if (state !== 'play' || stick.id !== null) return;
  if (e.clientX > window.innerWidth * 0.55) return;
  stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY; stick.x = stick.y = 0;
  stickRing.style.left = e.clientX + 'px'; stickRing.style.top = e.clientY + 'px'; stickRing.classList.add('on');
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});

  if (e.pointerType === 'mouse') { mouse.x = e.offsetX; mouse.y = e.offsetY; mouse.seen = true; return; }
  if (e.pointerId !== stick.id) return;
  const R = 52, dx = e.clientX - stick.ox, dy = e.clientY - stick.oy, len = Math.hypot(dx, dy), f = Math.min(1, R / (len || 1));
  stick.x = dx * f / R; stick.y = dy * f / R;

['pointerup', 'pointercancel'].forEach((t) => canvas.addEventListener(t, upHandler));

const tFire = $('tFire'), tReload = $('tReload');
tFire.addEventListener('pointerdown', (e) => { e.preventDefault(); try { tFire.setPointerCapture(e.pointerId); } catch (_) {} fireHeld = true; tFire.classList.add('held'); });
const fireUp = () => { fireHeld = false; tFire.classList.remove('held'); };

/* ───────── 戰鬥 ───────── */
function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(25, 125), life = rand(0.2, 0.55);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, max: life, color });
  }
}
function floatText(x, y, text, color) { floaters.push({ x, y, text, color, life: 0.7, max: 0.7 }); }
const bulletRange = (D) => D.lockRange * D.rangeScale + D.rangeAdd;
/* 閃避值換算（越高越好、效益遞減）
   冷卻時間 = 6 × 30 ÷ (30 + 閃避值)　→ 14：4.1 秒、45：2.4 秒、80：1.6 秒
   可累積次數 = 1 + ⌊閃避值 ÷ 40⌋，最多 3 次 → 14：1 次、45：2 次、80：3 次 */
const dodgeCooldown = (v) => 6 * 30 / (30 + v);
const dodgeCharges = (v) => Math.min(3, 1 + Math.floor(v / 40));
function startDodge() {
  if (state !== 'play' || !player || player.dodgeT > 0 || player.charges <= 0) return;
  const dm = cfg.dodgeMove;
  // 有移動輸入就往移動方向撲，沒有就往面向（準星）方向撲
  player.dodgeDir = player.moving ? player.moveAngle : player.angle;
  player.dodgeT = dm.time; player.invT = dm.time + dm.afterInvuln;
  player.charges--; if (player.chargeT <= 0) player.chargeT = dodgeCooldown(cfg.dodge);
  player.trail = []; player.trailClock = 0;
  if (Math.abs(Math.cos(player.dodgeDir)) > 0.2) player.faceLeft = Math.cos(player.dodgeDir) < 0;
  sfx.dodge(); updateDodge();
}
function updateDodge() {
  const max = dodgeCharges(cfg.dodge), box = $('dodgePips');
  if (box.children.length !== max) { box.textContent = ''; for (let i = 0; i < max; i++) { const d = document.createElement('span'); d.className = 'dpip'; box.appendChild(d); } }
  [...box.children].forEach((d, i) => d.classList.toggle('on', i < player.charges));
}
function reload() {
  if (state !== 'play' || player.ammo >= cfg.weapon.magazine || player.reload > 0) return;
  player.reload = cfg.weapon.reload;
}
function shootPlayer() {
  const wp = cfg.weapon;
  if (player.ammo <= 0 || player.reload > 0) return false;
  player.ammo--; updateAmmo(); sfx.shot(wp.sound); shake = Math.max(shake, wp.pellets > 1 ? 3 : 1.2);
  const mid = (wp.pellets - 1) / 2, ca = Math.cos(player.angle), sa = Math.sin(player.angle);
  const mz = muzzleWorld(player), mx = mz.x, my = mz.y;
  for (let i = 0; i < wp.pellets; i++) {
    const a = player.angle + (i - mid) * wp.spread + rand(-wp.jitter, wp.jitter), sp = rand(wp.speed[0], wp.speed[1]);
    const life = bulletRange(cfg) / sp;   // 不論子彈速度，飛到射程就消失
    bullets.push({ x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life, maxLife: life, r: wp.radius, team: 'p' });
  }
  burst(mx, my, '#f6cb76', 6);
  return true;
}
function shootEnemy(e) {
  const a = e.angle, mz = muzzleWorld(e);
  bullets.push({ x: mz.x, y: mz.y, vx: Math.cos(a) * ENEMY.bulletSpeed, vy: Math.sin(a) * ENEMY.bulletSpeed, age: 0, life: ENEMY.bulletLife, r: ENEMY.bulletR, team: 'e' });
}
function damage(amount) {
  if (player.invT > 0) return;   // 閃避無敵中
  // 沒有受擊無敵：每一次命中都會判定
  const ar = cfg.armor;
  const blocked = amount <= ar.value ? Math.random() < ar.blockLow : Math.random() < ar.blockHigh;
  const real = blocked ? Math.max(0, amount - ar.value) : amount;
  if (blocked) { floatText(player.x, player.y - 34, '格擋', '#f9cf70'); sfx.block(); }
  if (real > 0) { hurtT = 0.35; shake = Math.max(shake, 4); sfx.hurt(); }
  player.hp = Math.max(0, player.hp - real); updateHp();
  burst(player.x, player.y, '#53dfcb');
}
function moveWithCover(en, dx, dy) {
  const list = covers();
  for (const axis of ['x', 'y']) {
    const next = en[axis] + (axis === 'x' ? dx : dy);
    const px = axis === 'x' ? next : en.x, py = axis === 'y' ? next : en.y;
    if (!list.some((b) => Math.abs(px - b.x) < en.r * 0.55 + b.r && Math.abs(py - b.y) < en.r * 0.55 + b.r)) en[axis] = next;

function mouseWorld() { return unproj(mouse.x, mouse.y); }

function update(dt) {
  gameTime += dt;
  let dx = Number(keys.has('KeyD') || keys.has('ArrowRight')) - Number(keys.has('KeyA') || keys.has('ArrowLeft'));
  let dy = Number(keys.has('KeyS') || keys.has('ArrowDown')) - Number(keys.has('KeyW') || keys.has('ArrowUp'));
  dx += stick.x; dy += stick.y;
  const len = Math.hypot(dx, dy), mag = Math.min(1, len);

  // 閃避充能：一次補一格
  const maxC = dodgeCharges(cfg.dodge);

  $('dodgeBar').style.width = player.charges < maxC ? (100 * (1 - player.chargeT / dodgeCooldown(cfg.dodge))) + '%' : '0';
  player.invT = Math.max(0, player.invT - dt);

      let diff = Math.atan2(e.y - player.y, e.x - player.x) - a; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      if (Math.abs(diff) < bd) { bd = Math.abs(diff); snap = e; }

  // 動畫狀態：停下、按住開火、開火後一小段時間 → 分體瞄準；其餘奔跑 → 原本的提槍奔跑
  player.aimT = Math.max(0, (player.aimT || 0) - dt);
  if (wantsFire) player.aimT = cfg.anim.aimHold;
  player.aiming = (!player.moving || player.shot > 0 || player.aimT > 0) && player.dodgeT <= 0;
  if (player.dodgeT <= 0 && player.moving && Math.abs(Math.cos(player.moveAngle)) > 0.2) player.faceLeft = Math.cos(player.moveAngle) < 0;
  // 瞄準中且移動方向與面向相反＝後退

    if (wantsFire && (cfg.weapon.reloadMode !== 'magazine' || player.ammo > 0)) player.reload = 0;

        if (cfg.weapon.reloadMode === 'magazine') player.ammo = cfg.weapon.magazine;   // 整匣更換
        else {
          player.ammo = Math.min(cfg.weapon.magazine, player.ammo + 1);              // 逐發裝填
          if (player.ammo < cfg.weapon.magazine) player.reload = cfg.weapon.reload;

  for (let i = enemies.length - 1; i >= 0; i--) {

    } else {

        if (b.team === 'p') {

            for (const c of chunks.values()) { const k = c.cover.indexOf(blk); if (k !== -1) { c.cover.splice(k, 1); coverCache = null; break; } }

/* ───────── 繪圖 ───────── */
/* 角色姿勢：選身體幀、計算槍的旋轉（繪圖與槍口位置共用同一套計算） */
const DEG = Math.PI / 180;
function pose(en, isEnemy, forceAim, ang) {
  const A = ang === undefined ? en.angle : ang;
  const D = en.def || cfg, an = D.anim, fk = D.frames, m = D.assets.meta, sc = an.scale;
  // 奔跑且不瞄準：整張原圖（提槍奔跑），面向跟著移動方向
  if (en.moving && !en.aiming && !forceAim) {
    const n = fk.carry.length, i = ((Math.floor(gameTime / an.runCycle * n) % n) + n) % n;
    return { full: true, bodyKey: fk.carry[i], left: !!en.faceLeft, sc, by: 0 };
  }
  let bodyKey = fk.body.idle;
  const back = !!en.backward;

    const n = fk.body.run.length;
    let i = ((Math.floor(gameTime / (back ? an.backCycle : an.runCycle) * n) % n) + n) % n;
    if (back) i = n - 1 - i;            // 後退：跑步幀倒著播
    bodyKey = fk.body.run[i];

  let la = left ? Math.atan2(Math.sin(A), -Math.cos(A)) : A;

  const rt = en.shot > 0 ? Math.pow(en.shot / (en.shotMax || D.weapon.anim), 2) : 0;

    bodyKey, left, sc, rt, lean, by: breath,
    px: (fr.pivot[0] - m.cx) * sc, py: (fr.pivot[1] - m.cy) * sc,
    rot: la - m.gunAng * DEG + bob - an.recoil * rt,
    kick: -an.kick * rt * sc,

}
function muzzleWorld(en) {
  const p = pose(en, false, true), m = (en.def || cfg).assets.meta;

  if (p.full) {

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const vb = viewBounds(), gr = 110;
  const x0 = cam.x - vb.hw - gr, x1 = cam.x + vb.hw + gr, y0 = cam.y + vb.t - gr, y1 = cam.y + vb.b + gr;
  ctx.strokeStyle = 'rgba(109,163,155,0.16)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = Math.floor(x0 / gr) * gr; x < x1; x += gr) { const a = proj(x, y0), b = proj(x, y1); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
  for (let y = Math.floor(y0 / gr) * gr; y < y1; y += gr) { const a = proj(x0, y), b = proj(x1, y); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
  ctx.stroke();
  for (const c of chunks.values()) for (const d of c.details) {
    const q = proj(d.x, d.y);
    if (!onScreen(q, d.r * q.k + 20)) continue;
    ground(q, d.x, d.y);
    ctx.fillStyle = d.kind > 0.5 ? 'rgba(180,230,217,0.045)' : 'rgba(119,185,163,0.05)';
    ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 0.44, 0, 0, Math.PI * 2); ctx.fill();
    if (d.kind > 0.78) {
      ctx.strokeStyle = 'rgba(133,185,165,0.23)'; ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(d.x - 7, d.y + 3); ctx.lineTo(d.x + 3, d.y - 5); ctx.lineTo(d.x + 11, d.y + 2); ctx.stroke();
    }
  }
}
function drawCrate(b) {
  const q = proj(b.x, b.y), x = b.x, y = b.y;
  ground(q, x, y);
  ctx.fillStyle = 'rgba(8,27,35,0.6)'; ctx.beginPath(); ctx.ellipse(x + 6, y + 22, 25, 11, 0, 0, Math.PI * 2); ctx.fill();
  upright(q, x, y);
  // 箱子有頂面：越往畫面上方（越遠）看到的頂面越少
  const top = 4 + 6 * VIEW3D.squash * clamp(q.k / zoom, 0.6, 1.4);
  ctx.fillStyle = '#ffe3a1'; ctx.fillRect(x - 17, y - 17 - top, 34, top + 1);
  ctx.fillStyle = '#a46f38'; ctx.fillRect(x - 17, y - 17, 34, 34);
  ctx.fillStyle = b.hp === 3 ? '#f5c66f' : b.hp === 2 ? '#e6ae5c' : '#c88749'; ctx.fillRect(x - 14, y - 14, 28, 28);
  ctx.fillStyle = '#ffdf93'; ctx.fillRect(x - 14, y - 14, 28, 4);
}
function draw(t) {
  if (state === 'menu' || state === 'over' && !player) { cam.x += 0.25; cam.y += 0.1; stream(); }
  shx = shake ? rand(-shake, shake) : 0; shy = shake ? rand(-shake, shake) : 0;
  drawGround(t);
  const actors = [...covers().map((it) => ({ it, k: 'c' })), ...enemies.map((it) => ({ it, k: 'e' })), ...(player && state !== 'menu' ? [{ it: player, k: 'p' }] : [])].sort((a, b) => a.it.y - b.it.y);
  for (const { it, k } of actors) {
    const q = proj(it.x, it.y);
    if (!onScreen(q, 120 * q.k)) continue;
    if (k === 'c') drawCrate(it);
    else if (k === 'e') {
      drawCharacter(it, true);
      upright(q, it.x, it.y);
      ctx.fillStyle = '#26343b'; ctx.fillRect(it.x - 18, it.y - 42, 36, 4);
      ctx.fillStyle = '#ff988c'; ctx.fillRect(it.x - 18, it.y - 42, 36 * Math.max(0, it.hp) / ENEMY.hp, 4);
    } else {
      // 閃避殘影
      for (const g of it.trail || []) drawCharacter({ ...it, x: g.x, y: g.y, dodgeT: 1, moving: true, aiming: false, shot: 0 }, false, 0.28 * g.life / 0.25);
      drawCharacter(it, false);
    }
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const b of bullets) {
    const q = proj(b.x, b.y), lift = 7 * Math.sin(Math.min(1, b.age / (b.maxLife || b.life + b.age)) * Math.PI);
    ctx.fillStyle = 'rgba(4,24,32,0.4)'; ctx.beginPath(); ctx.ellipse(q.x + 3 * q.k, q.y + 5 * q.k, 6 * q.k, 3 * q.k * VIEW3D.squash, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = b.team === 'p' ? '#d5fff1' : '#ffb2a6';
    ctx.beginPath(); ctx.arc(q.x, q.y - lift * q.k, b.r * q.k, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of particles) {
    const q = proj(p.x, p.y), sz = 4 * q.k;
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(q.x - sz / 2, q.y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
  for (const f of floaters) {
    const q = proj(f.x, f.y);
    ctx.globalAlpha = Math.max(0, f.life / f.max); ctx.fillStyle = f.color; ctx.font = '800 ' + Math.round(15 * clamp(q.k, 0.7, 1.6)) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text, q.x, q.y);
  }
  ctx.globalAlpha = 1;
  if (state === 'play' && player) {
    // 鎖定範圍：在地面上的圓，投影後變成近大遠小的橢圓
    ctx.strokeStyle = 'rgba(249,207,112,0.4)'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.beginPath();
    for (let i = 0; i <= 72; i++) {
      const a = i / 72 * Math.PI * 2, q = proj(player.x + Math.cos(a) * cfg.lockRange, player.y + Math.sin(a) * cfg.lockRange);
      i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
    }
    ctx.stroke(); ctx.setLineDash([]);
    if (lockedTarget) {
      const e = lockedTarget; ground(proj(e.x, e.y), e.x, e.y); ctx.strokeStyle = '#ff5d67'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, 13, 0, Math.PI * 2); ctx.moveTo(e.x - 19, e.y); ctx.lineTo(e.x + 19, e.y); ctx.moveTo(e.x, e.y - 19); ctx.lineTo(e.x, e.y + 19); ctx.stroke();
    }
  }
  // 螢幕空間：遠處霧氣、近處加深、畫面外敵人指示、受傷暈影、滑鼠準星
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const hz = ctx.createLinearGradient(0, 0, 0, H);
  hz.addColorStop(0, 'rgba(46,92,102,' + VIEW3D.haze + ')'); hz.addColorStop(VIEW3D.anchor * 0.55, 'rgba(46,92,102,0)');
  hz.addColorStop(0.82, 'rgba(4,14,20,0)'); hz.addColorStop(1, 'rgba(4,14,20,0.32)');
  ctx.fillStyle = hz; ctx.fillRect(0, 0, W, H);
  if (state === 'play' && player) {
    const ax = W / 2, ay = H * VIEW3D.anchor;
    for (const e of enemies) {
      const q = proj(e.x, e.y), m = 22;
      if (q.x >= m && q.x <= W - m && q.y >= m + 56 && q.y <= H - m) continue;
      const vx = q.x - ax, vy = q.y - ay;
      const kx = vx > 0 ? (W - m - ax) / vx : vx < 0 ? (m - ax) / vx : Infinity;
      const ky = vy > 0 ? (H - m - ay) / vy : vy < 0 ? (m + 56 - ay) / vy : Infinity;
      const k = Math.min(kx, ky), px = ax + vx * k, py = ay + vy * k, a = Math.atan2(vy, vx);
      ctx.save(); ctx.translate(px, py); ctx.rotate(a); ctx.globalAlpha = 0.85; ctx.fillStyle = '#ff7d6e';
      ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-7, -7); ctx.lineTo(-7, 7); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    if (hurtT > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) / 2);
      g.addColorStop(0, 'rgba(255,60,60,0)'); g.addColorStop(1, 'rgba(255,60,60,' + (hurtT / 0.35 * 0.45) + ')');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (!isTouch() && mouse.seen) {
      ctx.strokeStyle = '#f9cf70'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 9, 0, Math.PI * 2);
      ctx.moveTo(mouse.x - 15, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y); ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 15, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 15); ctx.lineTo(mouse.x, mouse.y - 5); ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 15); ctx.stroke();
    }
  }
}

function frame(t) {
  // rAF 的時間戳可能早於按下開始時記錄的 last，所以 dt 要夾在 0 以上
  const dt = clamp((t - last) / 1000, 0, 0.05); last = t;
  try {
    if (state === 'play') update(dt);
    draw(t);
  } catch (err) {
    console.error(err);   // 單一幀出錯也不讓整個遊戲停住
  }
  requestAnimationFrame(frame);
}

/* ───────── 啟動 ───────── */
buildRoster(); showBest(); syncMute(); resize();
requestAnimationFrame((t) => { last = t; frame(t); });
loadImages().then(() => {
  const b = $('startBtn'); b.disabled = false; b.textContent = '開始遊戲';
}).catch(() => { $('startBtn').textContent = '素材載入失敗，請重新整理'; });
})();
</script>
